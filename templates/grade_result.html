<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <title>Graded Transcripts</title>
    </head>

    <body>
        <!-- Top Navigation Bar -->
        <nav class="top-nav">
            <div class="nav-items">
                <a href="/home" class="nav-item">Home</a>
                <a href="/transcripts" class="nav-item">Fetched Transcripts</a>
                <a href="/graded" class="nav-item">Graded Transcripts</a>
            </div>
        </nav>

        <div id="main-content">
            <h1><center>Graded Transcripts</center></h1>
            
            <!-- Results state -->
            <center>
                <div id="results-state">
                    <div id="output">
                        <table id="results-table">
                            <thead>
                                <tr>
                                    <th>Customer</th>
                                    <th>Grade</th>
                                    <th>Secondary Grade</th>
                                    <th>Transcript</th>
                                </tr>
                            </thead>
                            <tbody id="results-body"></tbody>
                        </table>
                        <div class="button-container">
                            <button class="download-btn" onclick="downloadCSV()">Download</button>
                            <button class="send-grader-btn">Send to GoogleLSA</button>
                        </div>
                    </div>
                </div>
            </center>
        </div>
        
        <!-- Modal for transcript -->
        <div id="transcriptModal" class="modal">
            <div class="modal-content">
                <button class="close" title="Close transcript">&times;</button>
                <div class="modal-header">
                    <div class="title-group">
                        <h4></h4>
                        <button class="copy-button" onclick="copyTranscript()" title="Copy transcript">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="transcriptText"></div>
            </div>
        </div>

        <script>
            // Constants
            const resultsState = document.getElementById('results-state');
            const modal = document.getElementById('transcriptModal');
            const closeBtn = document.querySelector('.close');
            const transcriptText = document.getElementById('transcriptText');

            // Modal functions
            function showTranscript(transcript, phoneNumber) {
                const formattedTranscript = transcript.replace(/\\n/g, '\n').replace(/\\'/g, "'");
                transcriptText.textContent = formattedTranscript;
                const isFailure = transcript.trim().startsWith('FAILED');
                document.querySelector('.title-group h4').textContent = `${phoneNumber} - ${isFailure ? 'Failed' : 'Latest Call'}`;

                modal.classList.add('show');
                document.getElementById('main-content').classList.add('shift');
            }

            function closeTranscript() {
                modal.classList.remove('show');
                document.getElementById('main-content').classList.remove('shift');
            }

            function copyTranscript() {
                const text = document.getElementById('transcriptText').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    const copyButton = document.querySelector('.copy-button');
                    copyButton.classList.add('copied');
                    setTimeout(() => copyButton.classList.remove('copied'), 2000);
                });
            }

            // Helper function to get previous month and year
            function getPreviousMonthYear() {
                const date = new Date();
                date.setMonth(date.getMonth() - 1);
                
                const months = [
                    'January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ];
                
                return `${months[date.getMonth()]} ${date.getFullYear()}`;
            }

            // Download function
            function downloadCSV() {
                const rows = document.querySelectorAll('#results-table tbody tr');
                let csv = 'Customer,Grade,Secondary Grade,Transcript\n';
                
                rows.forEach(row => {
                    const customer = row.cells[0].textContent;
                    const grade = row.querySelector('.grade-dropdown').value;
                    const gradeSecondary = row.cells[2].querySelector('.grade-dropdown')?.value || '';
                    
                    // Extract transcript from the button's onclick function
                    let transcript = '';
                    try {
                        const transcriptBtn = row.querySelector('.view-transcript-btn');
                        if (transcriptBtn) {
                            const onclickStr = transcriptBtn.getAttribute('onclick');
                            transcript = onclickStr.match(/showTranscript\(`(.*?)`,/)[1];
                        }
                    } catch (e) {
                        console.error('Error extracting transcript:', e);
                    }
                    
                    // Escape quotes for CSV format
                    transcript = transcript.replace(/"/g, '""');
                    
                    csv += `"${customer}","${grade}","${gradeSecondary}","${transcript}"\n`;
                });
                
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('hidden', '');
                a.setAttribute('href', url);
                a.setAttribute('download', `grading_results_${getPreviousMonthYear()}.csv`);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // Results display function
            function showResults(data) {
                const tbody = document.getElementById('results-body');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    // Customer column
                    const customerTd = document.createElement('td');
                    customerTd.textContent = row.phone_number || '';
                    tr.appendChild(customerTd);
                    
                    // Grade column
                    const gradeTd = document.createElement('td');
                    const gradeDropdown = document.createElement('select');
                    gradeDropdown.className = 'grade-dropdown';
                    
                    // Add placeholder option if it's a failed transcript
                    if (row.transcript?.trim().startsWith('FAILED')) {
                        const placeholderOption = document.createElement('option');
                        placeholderOption.value = "";
                        placeholderOption.textContent = "Select Grade";
                        placeholderOption.selected = true;
                        placeholderOption.disabled = true;
                        gradeDropdown.appendChild(placeholderOption);
                        gradeDropdown.classList.add('failure-grade');
                    }
                    
                    // Add grade options
                    gradeOptions.forEach(option => {
                        const optionElement = document.createElement('option');
                        optionElement.value = option;
                        optionElement.textContent = option;
                        if (option === row.grade && !row.transcript?.trim().startsWith('FAILED')) {
                            optionElement.selected = true;
                        }
                        gradeDropdown.appendChild(optionElement);
                    });
                    
                    // Add change event listener
                    gradeDropdown.addEventListener('change', function() {
                        if (this.value) {
                            this.classList.remove('failure-grade');
                        } else {
                            this.classList.add('failure-grade');
                        }
                        handleGradeChange(this, row.grade_secondary);
                    });
                    
                    gradeTd.appendChild(gradeDropdown);
                    tr.appendChild(gradeTd);
                    
                    // Secondary Grade column
                    const secondaryGradeTd = document.createElement('td');
                    tr.appendChild(secondaryGradeTd);
                    
                    // Transcript column
                    const transcriptTd = document.createElement('td');
                    const transcriptBtn = document.createElement('button');
                    transcriptBtn.className = 'view-transcript-btn';
                    if (row.transcript?.trim().startsWith('FAILED')) {
                        transcriptBtn.classList.add('failure');
                    }
                    transcriptBtn.textContent = 'View';
                    transcriptBtn.onclick = () => showTranscript(row.transcript || '', row.phone_number || '');
                    transcriptTd.appendChild(transcriptBtn);
                    tr.appendChild(transcriptTd);
                    
                    tbody.appendChild(tr);
                    
                    // Initialize secondary grade with the value from backend
                    handleGradeChange(gradeDropdown, row.grade_secondary);
                });
            }

            // Handle grade changes and secondary grade options
            function handleGradeChange(gradeDropdown, initialSecondaryGrade = '') {
                const row = gradeDropdown.closest('tr');
                const secondaryCell = row.cells[2];
                const selectedGrade = gradeDropdown.value;
                
                // Determine which options to show based on the selected grade
                let options = [];
                if (["Very satisfied", "Somewhat satisfied"].includes(selectedGrade)) {
                    options = gradeSecondaryOptions.positive;
                } else if (["Somewhat dissatisfied", "Very dissatisfied"].includes(selectedGrade)) {
                    options = gradeSecondaryOptions.negative;
                }
                
                // Create the secondary dropdown or clear the cell
                if (options.length > 0) {
                    const currentValue = secondaryCell.querySelector('select')?.value || initialSecondaryGrade;
                    const dropdown = document.createElement('select');
                    dropdown.className = 'grade-dropdown';
                    
                    // Add placeholder option for failed transcripts
                    if (row.querySelector('.view-transcript-btn').classList.contains('failure')) {
                        const placeholderOption = document.createElement('option');
                        placeholderOption.value = "";
                        placeholderOption.textContent = "Select Secondary Grade";
                        placeholderOption.selected = true;
                        placeholderOption.disabled = true;
                        dropdown.appendChild(placeholderOption);
                        dropdown.classList.add('failure-grade');
                    }
                    
                    options.forEach(option => {
                        const optionElement = document.createElement('option');
                        optionElement.value = option;
                        optionElement.textContent = option;
                        if (option === currentValue && !row.querySelector('.view-transcript-btn').classList.contains('failure')) {
                            optionElement.selected = true;
                        }
                        dropdown.appendChild(optionElement);
                    });
                    
                    // Add event listener for "Other" option
                    dropdown.addEventListener('change', function() {
                        if (this.value) {
                            this.classList.remove('failure-grade');
                        } else {
                            this.classList.add('failure-grade');
                        }
                        
                        if (this.value === 'Other') {
                            const customValue = prompt('Please enter custom grade secondary:');
                            if (customValue) {
                                const otherOption = this.querySelector('option[value="Other"]');
                                otherOption.value = customValue;
                                otherOption.textContent = customValue;
                                this.classList.remove('failure-grade');
                            } else {
                                this.value = this.querySelector('option:not([value="Other"])').value;
                                if (!this.value) {
                                    this.classList.add('failure-grade');
                                }
                            }
                        }
                    });
                    
                    secondaryCell.innerHTML = '';
                    secondaryCell.appendChild(dropdown);
                } else {
                    secondaryCell.innerHTML = '';
                }
            }

            // Initialize grade options
            let gradeOptions = [];
            let gradeSecondaryOptions = {
                positive: [],
                negative: []
            };

            // Initialize page
            document.addEventListener('DOMContentLoaded', async () => {
                // First load the options
                try {
                    const optionsResponse = await fetch('/options');
                    const optionsData = await optionsResponse.json();
                    gradeOptions = optionsData.GRADES;
                    gradeSecondaryOptions.positive = optionsData.GRADE_SECONDARY_POS;
                    gradeSecondaryOptions.negative = optionsData.GRADE_SECONDARY_NEG;
                    
                    // Then show the results after options are loaded
                    const resultsData = JSON.parse(document.getElementById('results-data').textContent);
                    showResults(resultsData.output);
                } catch (error) {
                    console.error('Error initializing page:', error);
                }

                // Set up event listeners
                document.querySelector('.close')?.addEventListener('click', closeTranscript);
                
                // Add click handler for send to GoogleLSA button
                document.querySelector('.send-grader-btn')?.addEventListener('click', function() {
                    // Check if any grade dropdowns are unselected
                    const allGradeDropdowns = document.querySelectorAll('.grade-dropdown');
                    const hasUnselectedGrades = Array.from(allGradeDropdowns).some(dropdown => {
                        return dropdown.selectedOptions[0]?.disabled || !dropdown.value;
                    });
                    
                    if (hasUnselectedGrades) {
                        alert('I cannot send the transcripts until they have all been graded!');
                        return;
                    }
                    
                    // If all grades are selected, proceed with sending to GoogleLSA
                    // TODO: Add your send to GoogleLSA logic here
                });
            });
        </script>

        <!-- Hidden element to store the results data -->
        <div id="results-data" style="display: none;">{{ results|tojson|safe }}</div>
    </body>
</html>
