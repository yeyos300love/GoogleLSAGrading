<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <link rel="stylesheet" type="text/css" href="../static/transcripts.css">
        <title>Google LSA Grading</title>
    </head>

    <body>
        <!-- Top Navigation Bar -->
        <nav class="top-nav">
            <div class="nav-items">
                <a href="/home" class="nav-item">Home</a>
            </div>
        </nav>

        <div id="main-content">
            <h1><center>Google LSA Grading</center></h1>
            
            <center>
                <div class="main-instance" onclick="window.location.href='/glsa-solo'">
                    <div class="main-title">Standard (Direct GLSA)</div>
                    <!--<a href="/index" class="transcript-title" style="text-decoration: none;">Podium (Advantage)</a>-->
                </div>
            </center>
            <br>
            <center>
                <div class="main-instance" onclick="window.location.href='/index'">
                    <div class="main-title">Podium (Advantage)</div>
                    <!--<a href="/index" class="transcript-title" style="text-decoration: none;">Podium (Advantage)</a>-->
                </div>
            </center>

            

        <script>


            // Handle CSV file upload
            const csvFileInput = document.getElementById('csvFileInput');
            csvFileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) {
                    console.error('No file selected');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                console.log('Uploading CSV file...', file.name);

                // First upload the CSV
                fetch('/upload-csv', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Upload response:', data);
                    if (data.success) {
                        showState('loading');
                        return fetch('/run-script', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                    } else {
                        throw new Error(data.error || 'Failed to upload CSV');
                    }
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Run script response:', data);
                    if (data.needs_2fa) {
                        loadingFrame.contentWindow.postMessage('show_2fa', '*');
                    }
                })
                .catch(error => {
                    console.error('Upload/Run Error:', error);
                    loadingFrame.contentWindow.postMessage('show_error', '*');
                });
            });

           
        </script>
    </body>
</html>
