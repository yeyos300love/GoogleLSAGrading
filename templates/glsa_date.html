<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <link rel="stylesheet" type="text/css" href="../static/glsa_date.css">
        <title>Google LSA Grading</title>
    </head>

    <body>
        <!-- Top Navigation Bar -->
        <nav class="top-nav">
            <div class="nav-items">
                <!-- <a href="/grade-result" class="nav-item">Back</a> -->
                <a href="/home" class="nav-item">Home</a>
                <a href="/index" class="nav-item">Podium (Home)</a>
            </div>
        </nav>

        <div id="main-content">
            <h1><center>Google LSA Grading (Podium)</center></h1>
            
            <center>
                <p>Select Date Range</p>

                <div class="main-instance" onclick="window.location.href='/glsa'">
                    <div class="main-title">Last Month</div>
                </div>
                <br>
                <div class="main-instance" onclick="showDatePicker()">
                    <div class="main-title">Custom Date Range</div>
                </div>
            </center>

            <!-- Date Picker Modal -->
            <div id="datePickerModal" class="date-modal">
                <div class="date-modal-content">
                    <div class="date-modal-header">
                        <h2>Select Date Range</h2>
                        <button class="date-modal-close" onclick="hideDatePicker()" title="Close">&times;</button>
                    </div>
                    <div class="date-picker-container">
                        <div class="date-input-group">
                            <label for="startDate">Start Date:</label>
                            <input type="date" id="startDate" class="date-input">
                        </div>
                        <div class="date-input-group">
                            <label for="endDate">End Date:</label>
                            <input type="date" id="endDate" class="date-input">
                        </div>
                    </div>
                    <div class="date-modal-actions">
                        <button class="btn-cancel" onclick="hideDatePicker()">Cancel</button>
                        <button class="btn-submit" onclick="submitDateRange()">Apply Date Range</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function showDatePicker() {
                document.getElementById('datePickerModal').style.display = 'block';
                // Set default dates
                const today = new Date();
                const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
                
                document.getElementById('endDate').value = today.toISOString().split('T')[0];
                document.getElementById('startDate').value = lastMonth.toISOString().split('T')[0];
                
                // Add click listeners to make entire date inputs clickable
                setupDateInputs();
            }

            function setupDateInputs() {
                const dateInputs = document.querySelectorAll('.date-input');
                dateInputs.forEach(input => {
                    // Remove any existing listeners
                    input.removeEventListener('click', triggerDatePicker);
                    input.removeEventListener('focus', triggerDatePicker);
                    
                    // Add new listeners
                    input.addEventListener('click', triggerDatePicker);
                    input.addEventListener('focus', triggerDatePicker);
                });
            }

            function triggerDatePicker(event) {
                const input = event.target;
                // Try to show the native date picker
                if (input.showPicker) {
                    try {
                        input.showPicker();
                    } catch (e) {
                        // Fallback for browsers that don't support showPicker
                        input.focus();
                    }
                } else {
                    // Fallback for older browsers
                    input.focus();
                }
            }

            function hideDatePicker() {
                document.getElementById('datePickerModal').style.display = 'none';
            }

            function submitDateRange() {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                
                if (!startDate || !endDate) {
                    alert('Please select both start and end dates');
                    return;
                }
                
                if (new Date(startDate) > new Date(endDate)) {
                    alert('Start date must be before end date');
                    return;
                }
                
                // Format dates from YYYY-MM-DD to MM-DD-YYYY
                const formatDate = (dateStr) => {
                    const [year, month, day] = dateStr.split('-');
                    return `${month}-${day}-${year}`;
                };
                
                const formattedStartDate = formatDate(startDate);
                const formattedEndDate = formatDate(endDate);
                
                // Redirect to your endpoint with date parameters
                //window.location.href = `/glsa?start_date=${startDate}&end_date=${endDate}`;
                window.location.href = `/glsa?start_date=${formattedStartDate}&end_date=${formattedEndDate}`;
            }

            // Close modal when clicking outside
            window.onclick = function(event) {
                const modal = document.getElementById('datePickerModal');
                if (event.target === modal) {
                    hideDatePicker();
                }
            }
        </script>

    </body>
</html>
