<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/loading.css">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <link rel="stylesheet" type="text/css" href="../static/glsa.css">
        <!--<link rel="stylesheet" type="text/css" href="../static/loading.css">-->
        <title>Agent</title>
    </head>

    <body>
        <nav class="top-nav">
            <div class="nav-items">
                <a href="/home" class="nav-item">Home</a>
                <a href="/transcripts" class="nav-item">Fetched Transcripts</a>
                <a href="/graded" class="nav-item">Graded Transcripts</a>
            </div>
        </nav>
    
        <div id="main-content">
            <!-- <h1><center>GoogleLSA Browser Agent</center></h1> -->
            
            <div id="controls">
                <button id="start-btn" onclick="startGLSA()">Start Browser Agent</button>
                <button id="stop-btn" onclick="stopGLSA()" disabled>Stop</button>
            </div>

            <div id="robot-container">
                <div id="container">
                    <div id="bot">
                        <div id="eyes">
                            <div class="eye" id="left"></div>
                            <div class="eye" id="right"></div>
                        </div>
                        <div id="leftarm">
                            <div class="finger"></div>
                            <div class="finger"></div>
                        </div>
                        <div id="rightarm">
                            <div class="finger"></div>
                            <div class="finger"></div>
                        </div>
                    </div>
                    <div id="neck"></div>
                    <div id="body"></div>
                    <div id="legs">
                        <div class="foot" id="left"></div>
                        <div class="foot" id="right"></div>
                    </div>
                </div>
                <div class="status-text">Agent is idle</div>
            </div>
        </div>
    
        <script>
            async function startGLSA() {
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
                
                // Start robot animation
                const container = document.getElementById('container');
                const statusText = document.querySelector('.status-text');
                container.classList.add('active');
                statusText.textContent = 'Agent is running...';
                
                fetch('/run-glsa', { method: 'POST' });
            }
    
            function stopGLSA() {
                fetch('/stop-glsa', { method: 'POST' })
                    .then(() => {
                        document.getElementById('start-btn').disabled = false;
                        document.getElementById('stop-btn').disabled = true;
                        
                        // Stop robot animation
                        const container = document.getElementById('container');
                        const statusText = document.querySelector('.status-text');
                        container.classList.remove('active');
                        statusText.textContent = 'Agent is idle';
                    });
            }

            //document.addEventListener('DOMContentLoaded', startGLSA);
        </script>
    </body>
</html>
