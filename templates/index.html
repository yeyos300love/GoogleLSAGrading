<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <title>Google LSA Grading</title>
    </head>

    <body>
        <!-- Top Navigation Bar -->
        <nav class="top-nav">
            <div class="nav-items">
                <a href="/home" class="nav-item">Home</a>
                <!--
                <a href="/transcripts" class="nav-item">Fetched Transcripts</a>
                <a href="/graded" class="nav-item">Graded Transcripts</a>
                -->
            </div>
        </nav>

        <div id="main-content">
            <h1><center>Google LSA Grading (Podium)</center></h1>
            
            <div id="initial-state">
                <center>
                    <p>Upload CSV options</p>
        
                    <div class="button-group">
                        <input type="file" id="csvFileInput" accept=".csv" style="display: none">
                        <div class="tooltip-container">
                            <button onclick="document.getElementById('csvFileInput').click()" class="upload-btn">Initial Data</button>
                            <div class="tooltip">Fetching & Grading (Podium), & Form Completion (GLSA)</div>
                        </div>
                    </div>
                    <br>
                    <div class="button-group">
                        <input type="file" id="csvFileInput2" accept=".csv" style="display: none">
                        <div class="tooltip-container">
                            <button onclick="document.getElementById('csvFileInput2').click()" class="upload-btn">Graded Data</button>
                            <div class="tooltip">GLSA Form Completion</div>
                        </div>
                    </div>
                </center>
            </div>
        </div>

        <script>
            // Handle CSV file upload
            const csvFileInput = document.getElementById('csvFileInput');
            csvFileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                console.log('Uploading CSV file...', file.name);

                // Upload the CSV
                fetch('/upload-csv', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Upload response:', data);
                    if (data.success) {
                        return fetch('/run-script', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                    } else {
                        throw new Error(data.error || 'Failed to upload CSV');
                    }
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Run script response:', data);
                    if (data.needs_2fa) {
                        window.location.href = '/loading?show_2fa=true';
                    }
                })
                .catch(error => {
                    console.error('Upload/Run Error:', error);
                    alert('Error: ' + error.message);
                });
            });

            // Handle graded CSV file upload
            const csvFileInput2 = document.getElementById('csvFileInput2');
            csvFileInput2.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;

                console.log('Uploading graded CSV file...', file.name);

                // Create and submit form directly
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/graded-csv-to-app';
                form.enctype = 'multipart/form-data';
                
                // Create file input
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.name = 'file';
                fileInput.files = event.target.files;
                form.appendChild(fileInput);
                
                // Add form to body and submit
                document.body.appendChild(form);
                form.submit();
            });
        </script>
    </body>
</html>
