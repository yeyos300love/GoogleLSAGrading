<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="../static/index.css">
        <link rel="stylesheet" type="text/css" href="../static/loading.css">
        <title>Loading</title>
    </head>

    <body>
        <!-- Top Navigation Bar -->
        <nav class="top-nav">
            <div class="nav-items">
                <a href="/home" class="nav-item">Home</a>
                <a href="/transcripts" class="nav-item">Fetched Transcripts</a>
                <a href="/graded" class="nav-item">Graded Transcripts</a>
            </div>
        </nav>

        <div id="main-content">
            <br><br>
            <!-- Universal Loading State -->
            <div class="loading-state">
                <center>
                    <h3><span id="status-message" class="typing-animation">Loading...</span></h3>
                    
                    <!-- 2FA Form (Hidden by default) -->
                    <div id="two_factor_form" style="display: none;">
                        <form id="twoFactorForm" onsubmit="submit_two_factor(event)" autocomplete="off">
                            <input type="text" id="two_factor_code" placeholder="enter code (ex. 123456)" autocomplete="off">
                            <button type="submit" class="action-button">Submit</button>
                        </form>
                    </div>

                    <!-- Loading Animation -->
                    <div id="container">
                        <div id="bot">
                            <div id="eyes">
                                <div id="left"><div class="eye"></div></div>
                                <div id="right"><div class="eye"></div></div>
                            </div>
                            <div id="leftarm">
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                            <div id="rightarm">
                                <div class="finger"></div>
                                <div class="finger"></div>
                            </div>
                        </div>
                        <div id="neck"></div>
                        <div id="body"></div>
                        <div id="legs">
                            <div id="left"><div class="foot"></div></div>
                            <div id="right"><div class="foot"></div></div>
                        </div>
                    </div>
                </center>
            </div>
        </div>

        <script>
            const statusMessage = document.getElementById('status-message');
            const twoFactorForm = document.getElementById('two_factor_form');
            const container = document.getElementById('container');

            // Check URL parameters and start appropriate action
            window.addEventListener('DOMContentLoaded', function() {
                const urlParams = new URLSearchParams(window.location.search);
                const action = urlParams.get('action');
                
                if (action === 'grade') {
                    startGrading();
                }
            });

            // Event listeners for messages from parent
            window.addEventListener('message', function(event) {
                if (event.data === 'show_2fa') {
                    statusMessage.textContent = "Hold on, let's get you logged into Podium...";
                    twoFactorForm.style.display = 'block';
                    container.style.display = 'none';
                } else if (event.data.type === 'grading_progress') {
                    statusMessage.textContent = `Now, let's grade those transcripts...(${event.data.current}/${event.data.total})`;
                    twoFactorForm.style.display = 'none';
                    container.style.display = 'block';
                } else if (event.data.type === 'fetch_progress') {
                    statusMessage.textContent = `Let's fetch those transcripts...(${event.data.current}/${event.data.total})`;
                    twoFactorForm.style.display = 'none';
                    container.style.display = 'block';
                } else if (event.data === 'start_grading') {
                    startGrading();
                }
            });

            function startGrading() {
                statusMessage.textContent = "Now, let's grade those transcripts...";
                twoFactorForm.style.display = 'none';
                container.style.display = 'block';
                
                fetch('/grade-transcripts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                }).then(response => {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    function processStream({ done, value }) {
                        if (done) return;
                        
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        
                        lines.forEach(line => {
                            if (line.startsWith('data: ')) {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'grading_progress') {
                                    statusMessage.textContent = `Now, let's grade those transcripts...(${data.current}/${data.total})`;
                                } else if (data.type === 'complete') {
                                    window.location.href = '/grade-result';
                                    return;
                                }
                            }
                        });
                        
                        return reader.read().then(processStream);
                    }
                    
                    return reader.read().then(processStream);
                });
            }

            function submit_two_factor(event) {
                event.preventDefault();
                const code = document.getElementById('two_factor_code').value.trim();
                if (code) {
                    // Hide form and show loading animation
                    twoFactorForm.style.display = 'none';
                    container.style.display = 'block';
                    
                    // Start the fetch with server-sent events
                    fetch('/fetch-transcripts', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code: code })
                    }).then(response => {
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        
                        function processStream({ done, value }) {
                            if (done) return;
                            
                            const chunk = decoder.decode(value);
                            const lines = chunk.split('\n');
                            
                            lines.forEach(line => {
                                if (line.startsWith('data: ')) {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.type === 'fetch_progress') {
                                        statusMessage.textContent = `Let's fetch those transcripts...(${data.current}/${data.total})`;
                                    } else if (data.type === 'complete') {
                                        window.location.href = '/transcript-result';
                                        return;
                                    }
                                }
                            });
                            
                            return reader.read().then(processStream);
                        }
                        
                        return reader.read().then(processStream);
                    });
                }
            }
        </script>
    </body>
</html>
