{% extends "base.html" %}

{% block title %}Podium - Fetch Transcripts{% endblock %}

{% block content %}
<h1>Fetching Transcripts from Podium</h1>

<!-- 2FA Input (shows initially, hides after submit) -->
<div id="tfa-container" style="display: block;">
    <div class="tfa-box">
        <h2>Enter Code</h2>
        <p>Check email for the 6-digit code</p>
        <input type="text" id="tfa-code" maxlength="6" placeholder="000000" autofocus>
        <button onclick="submit2FA()" class="btn btn-primary">Submit Code</button>
        <p id="tfa-error" style="color: red; display: none;"></p>
    </div>
</div>

<!-- Progress Display (shows after 2FA submitted) -->
<div id="progress-container" style="display: none;">
    <div class="progress-box">
        <h2 id="progress-message">Fetching transcripts...</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-bar" style="width: 0%">0%</div>
        </div>
        {# <!--<p id="progress-text">0 / {{ job.total_records }}</p>--> #}
    </div>
{% endblock %}
