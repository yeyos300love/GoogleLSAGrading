version: '3'
services:
  app:
    build:
      context: .
      dockerfile:  Dockerfile
    image: glsa_grading_app
    container_name: glsa_app_testbuild
    volumes:
      - .:/app
    command: python app.py
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: always
    secrets:
      - stash
secrets:
  stash:
    file: ./secrets.txt
    